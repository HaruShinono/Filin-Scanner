"Broken Access Control":
  title: "Broken Access Control"
  description: "Restrictions on what authenticated users are allowed to do are not properly enforced."
  impact: "Unauthorized access to data or functionality, privilege escalation."
  owasp: "A01:2021 - Broken Access Control"
  cwe: "CWE-284: Improper Access Control"

"Cryptographic Failure":
  title: "Cryptographic Failures"
  description: "Sensitive data is not properly protected in transit or at rest."
  impact: "Exposure of sensitive information (passwords, tokens)."
  owasp: "A02:2021 - Cryptographic Failures"
  cwe: "CWE-311: Missing Encryption of Sensitive Data"

"SQL Injection":
  title: "SQL Injection"
  description: "Interference with database queries allowing unauthorized data viewing or modification."
  impact: "Complete database compromise, data exfiltration."
  owasp: "A03:2021 - Injection"
  cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"

"Cross-Site Scripting (XSS)":
  title: "Cross-Site Scripting (XSS)"
  description: "Application includes untrusted data without proper validation/escaping."
  impact: "Session hijacking, website defacement, malicious redirection."
  owasp: "A03:2021 - Injection"
  cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation"

"Local File Inclusion":
  title: "Local File Inclusion (LFI)"
  description: "Allows an attacker to include files on a server through the web browser."
  impact: "Sensitive data exposure, potential Remote Code Execution."
  owasp: "A01:2021 - Broken Access Control"
  cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"

"Security Misconfiguration":
  title: "Security Misconfiguration"
  description: "Insecure default settings, incomplete configurations, or verbose error messages."
  impact: "System compromise or disclosure of sensitive information."
  owasp: "A05:2021 - Security Misconfiguration"
  cwe: "CWE-16: Configuration"

"Using Components with Known Vulnerabilities":
  title: "Vulnerable and Outdated Service Component"
  description: "Using a software component or JavaScript library with a known CVE vulnerability."
  impact: "Ranges from information disclosure to full system compromise depending on the CVE."
  owasp: "A06:2021 - Vulnerable and Outdated Components"
  cwe: "CWE-937: Using Components with Known Vulnerabilities"

"default":
  title: "Uncategorized Finding"
  description: "A potential security issue was detected by the scanning engine."
  impact: "Varies depending on the specific nature of the finding."
  owasp: "N/A"
  cwe: "N/A"